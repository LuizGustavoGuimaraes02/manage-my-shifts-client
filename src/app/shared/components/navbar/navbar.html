<nav class="navbar">
    <a class="brand" routerLink="/home">
        <span class="brand-logo">MS</span>
        <span>Manage My Shifts</span>
    </a>

    <div class="nav-links">
        <a routerLink="/home">Home</a>

        @if (isAdmin) {
            <a routerLink="/admin/shifts">All Shifts</a>
            <a routerLink="/admin/workers">All Workers</a>
        } @else {
            <a routerLink="/my-shifts">My Shifts</a>
            <a routerLink="/shifts/new">Add Shift</a>
            <a routerLink="/profile">Profile</a>
        }

                @if (firstName) {
            @if (isAdmin) {
                <a class="greeting" routerLink="/profile">Hello - {{ firstName }}</a>
            } @else {
                <span class="greeting">Hello - {{ firstName }}</span>
            }
        }

        <button type="button" (click)="logout()">Logout</button>
    </div>
</nav>
