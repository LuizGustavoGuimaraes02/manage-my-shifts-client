<h1>Register</h1>

<div *ngIf="errors.length > 0" class="error">
    <ul>
        <li *ngFor="let error of errors">{{ error }}</li>
    </ul>
</div>

<form (ngSubmit)="onSubmit()">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" [(ngModel)]="password" required>

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required>

    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" [(ngModel)]="firstName" required>

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" required>

    <button type="submit">Register</button>
</form>

<p>Already have an account? <a routerLink="/login">Log in</a></p>
